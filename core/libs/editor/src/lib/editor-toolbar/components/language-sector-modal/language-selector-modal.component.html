  <h2 mat-dialog-title>{{ t('selectLanguageToJsonSchemaDialog.title') }}</h2>

  <mat-dialog-content>
    <mat-form-field appearance="fill">
      <mat-label>{{ t('selectLanguageToJsonSchemaDialog.language') }}</mat-label>
      <mat-select [formField]="languageForm.language" data-cy="language-selector">
        @for (language of languages(); track language) {
          <mat-option [value]="language.tag">{{ language.name }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button (click)="selectLanguage()" mat-flat-button color="primary">
      {{ t('selectLanguageToJsonSchemaDialog.selectButton') }}
    </button>
  </mat-dialog-actions>
</ng-container>
