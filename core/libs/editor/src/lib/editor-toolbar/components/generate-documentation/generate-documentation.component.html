  <h2 mat-dialog-title>{{ t('generateHtmlDocDialog.title') }}</h2>
  <button class="close-button" mat-icon-button tabindex="-1" mat-dialog-close>
    <mat-icon>close</mat-icon>
  </button>

  <mat-dialog-content>
    @if (!isGenerating()) {
      <mat-form-field appearance="fill">
        <mat-label>{{ t('generateHtmlDocDialog.language') }}</mat-label>
        <mat-select [formField]="docForm.language" data-cy="htmlGenerationLanguage">
          @for (language of languages(); track language) {
            <mat-option [value]="language.tag">{{ language.name }}</mat-option>
          }
        </mat-select>
      </mat-form-field>
    } @else {
      <div class="loading">
        <h3>{{ t('generateHtmlDocDialog.generating') }}</h3>
        <mat-spinner></mat-spinner>
      </div>
    }
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-flat-button mat-dialog-close>{{ t('generateHtmlDocDialog.button.cancel') }}</button>
    <button (click)="openDocumentation()" type="button" mat-flat-button color="primary" data-cy="tbOpenDoc">
      {{ t('generateHtmlDocDialog.button.openDoc') }}
    </button>
    <button (click)="downloadDocumentation()" type="button" mat-flat-button color="primary" data-cy="tbDownloadDoc">
      {{ t('generateHtmlDocDialog.button.downloadDoc') }}
    </button>
  </mat-dialog-actions>
</ng-container>
