  <h2 mat-dialog-title>{{ t('loadModal.title') }}</h2>
  <button class="close-button" data-cy="close-notifications" mat-icon-button tabindex="-1" mat-dialog-close>
    <mat-icon>close</mat-icon>
  </button>

  <mat-dialog-content>
    <p>{{ t('loadModal.content') }}</p>
    <mat-form-field>
      <mat-label>{{ t('loadModal.fieldLabel') }}</mat-label>
      <textarea [formField]="modelForm.modelText" matInput></textarea>
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-flat-button mat-dialog-close>{{ t('loadModal.cancel') }}</button>
    <button [disabled]="modelForm().invalid()" (click)="loadModel()" mat-flat-button color="primary">
      {{ t('loadModal.loadModelButton') }}
    </button>
  </mat-dialog-actions>
</ng-container>
