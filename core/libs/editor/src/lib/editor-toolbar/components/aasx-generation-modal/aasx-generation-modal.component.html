<ng-container *transloco="let t">
  <h2 mat-dialog-title>{{ t('generateAasxDialog.title') }}</h2>
  <ame-dialog-close-button [disabled]="isGenerating()" />

  <mat-dialog-content>
    @if (!isGenerating()) {
      <mat-form-field appearance="fill">
        <mat-label>{{ t('generateAasxDialog.outputFileFormat') }}</mat-label>
        <mat-select [formField]="formatForm.format" data-testid="tbOutputButton">
          <mat-option data-testid="tbOutputButton-aasx" value="aasx">AASX</mat-option>
          <mat-option data-testid="tbOutputButton-xml" value="xml">XML</mat-option>
        </mat-select>
      </mat-form-field>
    } @else {
      <div class="loading">
        <h3>{{ t('generateAasxDialog.generating') }}</h3>
        <mat-spinner></mat-spinner>
      </div>
    }
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button [disabled]="isGenerating()" mat-flat-button mat-dialog-close>{{ t('generateAasxDialog.cancel') }}</button>
    <button [disabled]="isGenerating()" (click)="generate()" mat-flat-button color="primary">
      {{ t('generateAasxDialog.generate') }}
    </button>
  </mat-dialog-actions>
</ng-container>
