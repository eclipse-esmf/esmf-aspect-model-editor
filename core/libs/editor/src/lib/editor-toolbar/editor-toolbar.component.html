<ng-container *transloco="let t">
  <!-- Toolbar -->
  <div
    class="menu-items"
    (click)="blurActiveButton()"
    (keyup.enter)="blurActiveButton()"
    (keyup.space)="blurActiveButton()"
    tabindex="0"
    role="button"
    aria-label="Menu"
  >
    <div class="menu-items__group separator">
      <ame-bar-item
        [matTooltipShowDelay]="0"
        [matTooltipHideDelay]="0"
        [disabled]="isTextView() || isModelEmpty() || selectedCells()?.length !== 1"
        [matTooltip]="t('toolbar.editHighlightedCell')"
        (itemClick)="editSelectedCell()"
      >
        <mat-icon class="material-symbols-outlined">jump_to_element</mat-icon>
      </ame-bar-item>

      <ame-bar-item
        [matTooltipShowDelay]="0"
        [matTooltipHideDelay]="0"
        [disabled]="isTextView() || isModelEmpty() || !hasSelection()"
        [matTooltip]="t('toolbar.delete')"
        (itemClick)="onDelete()"
        data-testid="tbDeleteButton"
      >
        <mat-icon class="material-icons">delete</mat-icon>
      </ame-bar-item>

      <ame-bar-item
        [matTooltipShowDelay]="0"
        [matTooltipHideDelay]="0"
        [disabled]="isTextView() || isModelEmpty() || selectedCells()?.length !== 2"
        [matTooltip]="t('toolbar.connect')"
        (itemClick)="onConnect()"
        data-testid="tbConnectButton"
      >
        <mat-icon class="material-icons">commit</mat-icon>
      </ame-bar-item>

      @if (isAllShapesExpanded()) {
        <ame-bar-item
          [matTooltipShowDelay]="0"
          [matTooltipHideDelay]="0"
          [disabled]="isTextView() || isModelEmpty()"
          [matTooltip]="t('toolbar.collapseAll')"
          (itemClick)="onToggleExpand()"
          data-testid="collapseExpandToggle"
        >
          <mat-icon class="material-icons rotate-45">unfold_less</mat-icon>
        </ame-bar-item>
      } @else {
        <ame-bar-item
          [matTooltipShowDelay]="0"
          [matTooltipHideDelay]="0"
          [disabled]="isTextView() || isModelEmpty()"
          [matTooltip]="t('toolbar.expandAll')"
          (itemClick)="onToggleExpand()"
          data-testid="collapseExpandToggle"
        >
          <mat-icon class="material-icons rotate-45 editor-icon-active">unfold_more</mat-icon>
        </ame-bar-item>
      }

      <ame-bar-item
        [matTooltipShowDelay]="0"
        [matTooltipHideDelay]="0"
        [disabled]="isTextView() || isModelEmpty()"
        [matTooltip]="t('toolbar.format')"
        (itemClick)="onFormat()"
        data-testid="formatButton"
      >
        <mat-icon class="material-icons rotate-90">schema</mat-icon>
      </ame-bar-item>

      <ame-bar-item
        [matTooltipShowDelay]="0"
        [matTooltipHideDelay]="0"
        [disabled]="isTextView() || isModelEmpty()"
        [matTooltip]="isPropertyFilterActive() ? t('toolbar.propertyFilterDeactivate') : t('toolbar.propertyFilterActivate')"
        [class.toolbar-item--active]="isPropertyFilterActive()"
        [attr.aria-pressed]="isPropertyFilterActive()"
        (itemClick)="togglePropertyFilter()"
        data-testid="tbPropertyFilterButton"
      >
        <mat-icon class="material-icons">filter_list</mat-icon>
      </ame-bar-item>

      <ame-bar-item
        [matTooltipShowDelay]="0"
        [matTooltipHideDelay]="0"
        [disabled]="isModelEmpty()"
        [matTooltip]="t('toolbar.validate')"
        (itemClick)="validateFile()"
        data-testid="tbValidateButton"
      >
        <mat-icon class="material-icons">task</mat-icon>
      </ame-bar-item>

      <ame-bar-item
        [matTooltipShowDelay]="0"
        [matTooltipHideDelay]="0"
        [disabled]="isModelEmpty()"
        [matTooltip]="t('toolbar.prefixes')"
        (itemClick)="openPrefixManagement()"
        data-testid="tbPrefixesButton"
      >
        <mat-icon class="material-icons">alternate_email</mat-icon>
      </ame-bar-item>
    </div>

    <div class="menu-items__group">
      <ame-bar-item [disabled]="isTextView() || isModelEmpty()" [matTooltip]="t('editorCanvas.zoomInProgress')" (itemClick)="zoomIn()">
        <mat-icon>zoom_in</mat-icon>
      </ame-bar-item>
      <ame-bar-item [disabled]="isTextView() || isModelEmpty()" [matTooltip]="t('editorCanvas.zoomOutProgress')" (itemClick)="zoomOut()">
        <mat-icon>zoom_out</mat-icon>
      </ame-bar-item>
    </div>
  </div>
</ng-container>
