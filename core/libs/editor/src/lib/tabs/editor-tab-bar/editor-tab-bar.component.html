<div class="tab-bar-container" *transloco="let t" data-testid="editor-tab-bar">
  <div class="tabs-scroll-area" #scrollContainer (wheel)="onWheel($event)">
    @for (tab of tabState.tabs(); track tab.id) {
      <div
        class="tab-item"
        [class.active]="tab.id === tabState.activeTabId()"
        [attr.data-tab-id]="tab.id"
        [title]="tab.namespace ? tab.namespace + ':' + tab.file : tab.file"
        (click)="selectTab(tab.id)"
        (keydown.enter)="selectTab(tab.id)"
        (keydown.space)="selectTab(tab.id)"
        tabindex="0"
        role="tab"
        data-testid="editor-tab"
      >
        <mat-icon class="tab-icon">description</mat-icon>
        <span class="tab-title">{{ tab.file }}</span>
        @if (tab.isDirty) {
          <span class="tab-dirty-indicator" title="Unsaved changes"></span>
        }
        <button
          class="tab-close-btn"
          (click)="closeTab($event, tab.id)"
          mat-icon-button
          data-testid="editor-tab-close"
          aria-label="Close tab"
        >
          <mat-icon>close</mat-icon>
        </button>
      </div>
    }
  </div>

  <div class="tab-fixed-actions">
    <button class="tab-action-btn tab-scroll-btn" (click)="scrollLeft()" mat-icon-button aria-label="Scroll tabs left" title="Scroll left">
      <mat-icon>chevron_left</mat-icon>
    </button>
    <button
      class="tab-action-btn tab-scroll-btn"
      (click)="scrollRight()"
      mat-icon-button
      aria-label="Scroll tabs right"
      title="Scroll right"
    >
      <mat-icon>chevron_right</mat-icon>
    </button>
    <button
      class="tab-action-btn tab-add-btn"
      [matTooltip]="t('tooltips.openNewModelTab')"
      (click)="addTab()"
      mat-icon-button
      data-testid="editor-tab-add"
      aria-label="Add new model tab"
    >
      <mat-icon>add</mat-icon>
    </button>
    <ame-editor-view-toggle class="tab-view-toggle"></ame-editor-view-toggle>
  </div>
</div>
