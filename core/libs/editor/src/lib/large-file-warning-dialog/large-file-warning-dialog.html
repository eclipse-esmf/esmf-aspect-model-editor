<ng-container *transloco="let t">
  <h2 mat-dialog-title>{{ t('largeFileWarning.title', {count: elementsCount()}) }}</h2>

  <mat-dialog-content>
    <p>{{ t('largeFileWarning.description') }}</p>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-flat-button (click)="close('cancel')">{{ t('largeFileWarning.cancel') }}</button>
    <button mat-flat-button color="primary" (click)="close('open')">{{ t('largeFileWarning.continue') }}</button>
  </mat-dialog-actions>
</ng-container>
