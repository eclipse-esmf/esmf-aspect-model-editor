  <h3 matDialogTitle>{{ t('saveModalDialog.title') }}</h3>

  <mat-dialog-content>
    <p>{{ t('saveModalDialog.content') }}</p>
  </mat-dialog-content>

  <mat-dialog-actions class="actions" align="end">
    <button [disabled]="disabledButton()" (click)="close(false)" mat-button>{{ t('saveModalDialog.continueButton') }}</button>
    <button [disabled]="disabledButton()" (click)="close(true)" mat-flat-button>{{ t('saveModalDialog.discardButton') }}</button>
    <button [disabled]="disabledButton()" (click)="saveModel()" mat-flat-button color="primary">
      {{ t('saveModalDialog.saveButton') }}
    </button>
  </mat-dialog-actions>
</ng-container>
