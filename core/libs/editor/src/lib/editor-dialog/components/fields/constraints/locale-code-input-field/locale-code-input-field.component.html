<ng-container *transloco="let t">
  <mat-form-field [floatLabel]="field().disabled() ? 'always' : 'auto'" appearance="fill" subscriptSizing="dynamic">
    <mat-label>localeCode *</mat-label>
    <input [formField]="field" [matAutocomplete]="auto" matInput data-cy="localeCode" />
    <mat-autocomplete #auto="matAutocomplete">
      @for (lang of filteredLanguages(); track lang.tag) {
        <mat-option class="language-code" [value]="lang.tag">
          {{ lang.tag }}<br /><span class="option-description">{{ lang.name }}</span>
        </mat-option>
      }
    </mat-autocomplete>
    @if (hasError('required')) {
      <mat-error>{{ t('editorCanvas.shapeSetting.field.constraints.localeCodeRequired') }}</mat-error>
    }
  </mat-form-field>
</ng-container>
