<ng-container>
  @for (locale of getDescriptionsLocales(); track locale) {
    @if (field(locale); as descriptionField) {
      <mat-form-field
        [floatLabel]="descriptionField().disabled() ? 'always' : 'auto'"
        [matTooltip]="isInherited(locale) ? 'This was extended from ' + elementExtends.extends_.name : ''"
        [matTooltipPosition]="'left'"
        appearance="fill"
      >
        <mat-label>description({{ locale }})</mat-label>
        <textarea [formField]="descriptionField" matInput data-cy="description"></textarea>
      </mat-form-field>
    }
  }
</ng-container>
