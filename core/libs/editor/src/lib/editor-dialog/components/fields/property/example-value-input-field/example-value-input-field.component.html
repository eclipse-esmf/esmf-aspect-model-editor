<ng-container *transloco="let t">
  @if (isDataTypeBoolean) {
    <mat-form-field [floatLabel]="displayField().disabled() ? 'always' : 'auto'" appearance="fill">
      <mat-label>exampleValue</mat-label>
      <mat-select [formField]="displayField">
        <mat-option (click)="selectExampleValue(TRUE)" value="true"> true </mat-option>
        <mat-option (click)="selectExampleValue(FALSE)" value="false"> false </mat-option>
      </mat-select>
    </mat-form-field>
  } @else {
    <mat-form-field
      [floatLabel]="displayField().disabled() ? 'always' : 'auto'"
      [matTooltip]="hasComplexDataType() ? t('editorCanvas.shapeSetting.field.property.exampleValueDisabledComplex') : ''"
      appearance="fill"
    >
      <mat-label>exampleValue</mat-label>
      <input #exampleValueInput [formField]="displayField" [matAutocomplete]="auto" matInput data-cy="exampleValue" />
      @if (displayField().disabled()) {
        <button
          (click)="unlockExampleValue(auto)"
          data-cy="clear-example-value-button"
          type="button"
          matSuffix
          mat-icon-button
          tabindex="-1"
        >
          <mat-icon>close</mat-icon>
        </button>
      }

      <mat-autocomplete #auto="matAutocomplete" [hideSingleSelectionIndicator]="true">
        @if (exampleValueInput.value) {
          <mat-option [value]="exampleValueInput.value" (click)="selectExampleValue(exampleValueInput.value)">
            <ame-element
              [isNewValue]="true"
              [type]="{type: 'text', symbol: 'T'}"
              [name]="exampleValueInput.value"
              size="medium"
            ></ame-element>
          </mat-option>
        }

        @let fValues = filteredValues();
        @if (fValues.length === 0 && exampleValueInput.value) {
          <mat-option [value]="exampleValueInput.value" (click)="selectExampleValue(exampleValueInput.value, false)">
            <ame-element
              [isNewValue]="true"
              [type]="{type: 'value', symbol: 'V'}"
              [name]="exampleValueInput.value"
              size="medium"
            ></ame-element>
          </mat-option>
        } @else {
          @for (value of fValues; track value.name) {
            <mat-option [value]="value.name" (click)="selectExampleValue(value)">
              <ame-element [type]="{type: 'value', symbol: 'V'}" [name]="value.name" size="medium"></ame-element>
            </mat-option>
          }
        }
      </mat-autocomplete>
    </mat-form-field>
  }
</ng-container>
