<ng-container *transloco="let t">
  <mat-form-field [floatLabel]="inputField().disabled() ? 'always' : 'auto'" appearance="fill">
    <mat-label>quantityKinds</mat-label>
    <mat-chip-grid #chipList>
      @for (input of quantityKindValues(); track input) {
        <mat-chip-row [disabled]="!editable()" [removable]="editable()" (removed)="remove(input)">
          {{ input }}
          @if (editable()) {
            <button matChipRemove data-cy="input">
              <mat-icon>cancel</mat-icon>
            </button>
          }
        </mat-chip-row>
      }
      <input
        #input
        [formField]="inputField"
        [matAutocomplete]="auto"
        [matChipInputFor]="chipList"
        [matChipInputSeparatorKeyCodes]="separatorKeysCodes()"
        [placeholder]="editable() ? t('editorCanvas.shapeSetting.field.unit.searchQuantityKinds') : ''"
        matInput
        data-cy="quantityKindValues"
      />
    </mat-chip-grid>
    <mat-autocomplete #auto="matAutocomplete">
      <mat-optgroup label="Quantity Kind">
        @for (qk of filteredQuantityKinds(); track qk) {
          <mat-option [value]="qk" (onSelectionChange)="$event.isUserInput && onSelectionChange(qk)">
            {{ qk }}
          </mat-option>
        }
      </mat-optgroup>
    </mat-autocomplete>
  </mat-form-field>
</ng-container>
