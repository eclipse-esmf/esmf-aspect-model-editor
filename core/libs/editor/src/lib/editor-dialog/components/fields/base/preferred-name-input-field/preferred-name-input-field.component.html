@for (locale of getPreferredNamesLocales(); track locale) {
  @if (field(locale); as preferredNameField) {
    <mat-form-field
      [floatLabel]="preferredNameField().disabled() ? 'always' : 'auto'"
      [matTooltip]="isInherited(locale) ? 'This was extended from ' + elementExtends.extends_.name : ''"
      [matTooltipPosition]="'left'"
      appearance="fill"
    >
      <mat-label>preferredName({{ locale }})</mat-label>
      <input class="ellipsis" [formField]="preferredNameField" matInput data-cy="preferredName" />
    </mat-form-field>
  }
}
