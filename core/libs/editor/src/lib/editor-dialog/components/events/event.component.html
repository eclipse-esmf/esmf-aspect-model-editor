<ng-container *transloco="let t">
  <ame-base-input [signalForm]="signalForm()"></ame-base-input>
  <ame-element-list
    [label]="t('editorCanvas.shapeSetting.ameElementListLabel.incomingEdges')"
    [element]="element()"
    relation="parents"
    iconRotation="rotate270"
  ></ame-element-list>
  <ame-element-list
    [label]="t('editorCanvas.shapeSetting.ameElementListLabel.outgoingEdges')"
    [element]="element()"
    relation="children"
  ></ame-element-list>
</ng-container>
