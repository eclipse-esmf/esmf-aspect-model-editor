  @if (canBeAnonymous()) {
    <div class="anonymous-toggle-card">
      <div class="anonymous-toggle-card__content">
        <div class="anonymous-toggle-card__title-row">
          <mat-icon class="anonymous-toggle-card__icon">link_off</mat-icon>
          <span class="anonymous-toggle-card__title">{{ t('editorCanvas.shapeSetting.anonymous') }}</span>
        </div>
        <p class="anonymous-toggle-card__hint">{{ t('editorCanvas.shapeSetting.anonymousHint') }}</p>
      </div>
      <mat-slide-toggle
        [checked]="isAnonymous()"
        [attr.aria-label]="t('editorCanvas.shapeSetting.anonymous')"
        (change)="onAnonymousToggleChange($event.checked)"
        color="primary"
        data-cy="anonymousToggle"
      />
    </div>
  }

  <ame-base-input [signalForm]="signalForm()"></ame-base-input>
  <ame-element-list
    [label]="t('editorCanvas.shapeSetting.ameElementListLabel.incomingEdges')"
    [elements]="element()?.parents"
    iconRotation="rotate270"
  ></ame-element-list>
  <ame-element-list
    [label]="t('editorCanvas.shapeSetting.ameElementListLabel.outgoingEdges')"
    [elements]="element()?.children"
  ></ame-element-list>
</ng-container>
