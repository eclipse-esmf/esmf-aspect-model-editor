  <mat-form-field appearance="fill">
    <mat-label>{{ t('entityValue.edit.searchBar') }}</mat-label>
    <input (input)="sendNewSearchValue($event)" matInput type="search" data-cy="searchEntityValueInputField" />
    <mat-icon matSuffix>search</mat-icon>
  </mat-form-field>

  <button
    class="add-button"
    [disabled]="disableAddNewEntityValue()"
    [matTooltip]="t('entityValue.edit.addComplexValue')"
    (click)="add.emit()"
    type="button"
    mat-fab
    color="accent"
    data-cy="addNewEntityValueButton"
  >
    <mat-icon>add</mat-icon>
  </button>
</ng-container>
