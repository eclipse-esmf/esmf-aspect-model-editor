  <ame-base-input [signalForm]="signalForm()" [hideDescription]="true" [hideSee]="true"></ame-base-input>
  <ame-symbol-input-field [signalForm]="signalForm()"></ame-symbol-input-field>
  <ame-code-input-field [signalForm]="signalForm()"></ame-code-input-field>
  <ame-reference-unit-input-field [signalForm]="signalForm()"></ame-reference-unit-input-field>
  <ame-conversion-factor-input-field [signalForm]="signalForm()"></ame-conversion-factor-input-field>
  <ame-numeric-conversion-factor-input-field [signalForm]="signalForm()"></ame-numeric-conversion-factor-input-field>
  <ame-quantity-kinds-input-field [signalForm]="signalForm()"></ame-quantity-kinds-input-field>
  <ame-element-list
    [label]="t('editorCanvas.shapeSetting.ameElementListLabel.incomingEdges')"
    [elements]="element()?.parents"
    iconRotation="rotate270"
  ></ame-element-list>
  <ame-element-list
    [label]="t('editorCanvas.shapeSetting.ameElementListLabel.outgoingEdges')"
    [elements]="element()?.children"
  ></ame-element-list>
</ng-container>
