  <h2 mat-dialog-title>{{ title() }}</h2>
  <button class="close-button" (click)="onClose()" mat-icon-button tabindex="-1">
    <mat-icon>close</mat-icon>
  </button>

  <mat-dialog-content>
    <mat-form-field appearance="outline">
      <textarea
        [value]="content()"
        (input)="content.set($any($event.target).value)"
        data-cy="dialogContent"
        spellcheck="false"
        matInput
      ></textarea>
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-flat-button mat-dialog-close>{{ t('previewDialog.cancel') }}</button>
    <button (click)="reset()" mat-raised-button>{{ t('previewDialog.resetContent') }}</button>
    <button (click)="onCopyToClipboard()" mat-raised-button>{{ t('previewDialog.copyToClipboard') }}</button>
    <button (click)="onDownload()" mat-raised-button color="primary" data-cy="downloadFileButton">
      {{ t('previewDialog.downloadFile') }}
    </button>
  </mat-dialog-actions>
</ng-container>
