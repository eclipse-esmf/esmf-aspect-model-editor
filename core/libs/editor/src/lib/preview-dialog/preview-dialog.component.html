<ng-container *transloco="let t">
  <h2 mat-dialog-title>{{ title() }}</h2>
  <ame-dialog-close-button />

  <mat-dialog-content class="preview__content">
    @if (hasLanguageSwitch) {
      <div class="preview__toolbar">
        <mat-form-field class="preview__language" appearance="outline" subscriptSizing="dynamic">
          <mat-label>{{ t('previewDialog.language') }}</mat-label>
          <mat-select
            [value]="language()"
            [disabled]="regenerating()"
            (selectionChange)="changeLanguage($event.value)"
            data-testid="previewLanguageSelect"
          >
            @for (lang of languages; track lang.tag) {
              <mat-option [value]="lang.tag" [attr.data-testid]="'previewLanguage-' + lang.tag"
                >{{ lang.name }} ({{ lang.tag }})</mat-option
              >
            }
          </mat-select>
        </mat-form-field>
        <span class="preview__hint">{{ t('previewDialog.languageHint') }}</span>
      </div>
    }
    @if (regenerating()) {
      <mat-progress-bar mode="indeterminate" data-testid="previewRegenerating" />
    }
    <mat-form-field class="preview__editor" appearance="outline" subscriptSizing="dynamic">
      <textarea
        [value]="content()"
        [readonly]="regenerating()"
        (input)="content.set($any($event.target).value)"
        data-testid="dialogContent"
        spellcheck="false"
        matInput
      ></textarea>
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-flat-button mat-dialog-close>{{ t('previewDialog.cancel') }}</button>
    <button (click)="reset()" mat-raised-button data-testid="previewResetButton">{{ t('previewDialog.resetContent') }}</button>
    <button (click)="onCopyToClipboard()" mat-raised-button data-testid="previewCopyButton">
      {{ t('previewDialog.copyToClipboard') }}
    </button>
    <button (click)="onDownload()" mat-raised-button color="primary" data-testid="downloadFileButton">
      {{ t('previewDialog.downloadFile') }}
    </button>
  </mat-dialog-actions>
</ng-container>
