  <div
    class="background"
    (click)="closeSearch()"
    (keyup.enter)="closeSearch()"
    (keyup.space)="closeSearch()"
    tabindex="0"
    role="button"
    aria-label="Close search overlay"
  ></div>
  <mat-form-field class="search">
    <mat-label>{{ t('searches.files.label') }}</mat-label>
    <input [matAutocomplete]="auto" [value]="searchQuery()" (input)="searchQuery.set($any($event.target).value)" type="text" matInput />
    <mat-icon [class.rotate]="loading()" matSuffix>{{ loading() ? 'refresh' : 'description' }}</mat-icon>

    <mat-autocomplete class="search-autocomplete" #auto="matAutocomplete">
      @for (entry of searchableFiles(); track entry.aspectModelUrn || entry.file + entry.namespace) {
        <mat-option class="list-option" (click)="openFile(entry)">
          <mat-icon>description</mat-icon>
          <div class="file-element">
            <span>{{ entry.file }}</span>
            <span>{{ entry.namespace }}</span>
          </div>
        </mat-option>
      }
    </mat-autocomplete>
  </mat-form-field>
</ng-container>
