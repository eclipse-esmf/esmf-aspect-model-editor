  <div
    class="background"
    (click)="closeSearch()"
    (keyup.enter)="closeSearch()"
    (keyup.space)="closeSearch()"
    tabindex="0"
    role="button"
    aria-label="Close search overlay"
  ></div>
  <mat-form-field class="search">
    <mat-label>{{ t('searches.elementsLabel') }}</mat-label>
    <input
      [matAutocomplete]="auto"
      [value]="searchQuery()"
      (input)="searchQuery.set($any($event.target).value)"
      type="text"
      matInput
      data-cy="searchInputField"
    />
    <mat-icon matSuffix>view_comfy_alt</mat-icon>

    <mat-autocomplete class="search-autocomplete" #auto="matAutocomplete">
      @for (item of transformedElements(); track item.element) {
        <mat-option class="list-option" (click)="openElement(item.element)">
          <div [class.has-external-element]="loadedFiles.isElementExtern(item.element) && !item.element.isPredefined">
            <ame-element
              [type]="item"
              [name]="item.element.name"
              [description]="item.element.aspectModelUrn"
              [disabledTooltipDescriptionLength]="100"
              [disabledTooltipNameLength]="60"
              size="medium"
            ></ame-element>
            <div class="align-self-center">
              @if (loadedFiles.isElementExtern(item.element) && !item.element.isPredefined) {
                <mat-icon class="open-icon">open_in_new</mat-icon>
              }
            </div>
          </div>
        </mat-option>
      }
    </mat-autocomplete>
  </mat-form-field>
</ng-container>
