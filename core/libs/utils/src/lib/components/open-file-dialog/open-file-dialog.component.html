  <h2 mat-dialog-title>{{ t('searches.files.openDialog.title', {fileName: fileData.file}) }}</h2>

  <mat-dialog-content>
    <p [innerHTML]="t('searches.files.openDialog.content', {fileName: fileData.file, namespace: fileData.namespace})"></p>
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-button mat-dialog-close>{{ t('searches.files.openDialog.cancel') }}</button>
    <button mat-flat-button mat-dialog-close="open-in" color="primary">
      {{ t('searches.files.openDialog.openInThisWindow') }}
    </button>
    <button mat-flat-button mat-dialog-close="open-out" color="primary">
      {{ t('searches.files.openDialog.openInNewWindow') }}
    </button>
  </mat-dialog-actions>
</ng-container>
