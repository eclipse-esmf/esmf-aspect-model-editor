  <ame-resize-gutter
    [(width)]="width"
    [minWidth]="minWidth"
    [maxWidth]="maxWidth"
    [storageKey]="storageKey"
    edge="end"
    data-testid="workspace-resize-gutter"
  ></ame-resize-gutter>

  <div class="header">
    <div class="title">
      <h2>{{ t('sidebar.workspace.title') }}</h2>

      <button
        class="copy-path"
        [matTooltip]="t('sidebar.workspace.copyWorkspacePath')"
        (click)="copyWorkspacePath()"
        mat-mini-fab
        data-testid="workspaceCopyPathButton"
      >
        <mat-icon>content_copy</mat-icon>
      </button>

      <button
        class="refresh"
        [class.loading]="loading()"
        [class.disabled]="loading()"
        [matTooltip]="loading() ? t('sidebar.workspace.refreshing') : t('sidebar.workspace.refresh')"
        [disabled]="loading()"
        (click)="refreshWorkspace()"
        mat-mini-fab
        data-testid="workspaceRefreshButton"
      >
        <mat-icon>refresh</mat-icon>
      </button>

      <span class="clear-wrapper" [matTooltip]="clearWorkspaceTooltip()">
        <button
          class="clear"
          [disabled]="isClearWorkspaceDisabled()"
          [attr.aria-label]="t('sidebar.workspace.clear')"
          (click)="clearWorkspace()"
          mat-mini-fab
          data-testid="workspaceClearButton"
        >
          <mat-icon>delete_sweep</mat-icon>
        </button>
      </span>
    </div>

    <button (click)="sidebarService.workspace.close()" mat-mini-fab data-testid="sidebar-close">
      <mat-icon>close</mat-icon>
    </button>
  </div>
  @if (error()) {
    <ame-workspace-error [error]="error()"></ame-workspace-error>
  } @else if (namespacesKeys.length === 0) {
    <ame-workspace-empty [loading]="loading()"></ame-workspace-empty>
  } @else {
    <ame-workspace-file-list class="list"></ame-workspace-file-list>
    @if (sidebarService.fileElements.opened()) {
      <ame-workspace-file-elements class="column-two"></ame-workspace-file-elements>
    }
  }
</ng-container>
