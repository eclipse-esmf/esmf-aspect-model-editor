<ng-container *transloco="let t">
  <ame-bar-item
    class="sidebar__workspace"
    [matTooltipShowDelay]="0"
    [matTooltipHideDelay]="0"
    [class.selected]="sidebarService.workspace.opened()"
    [matTooltip]="t('tooltips.workspace')"
    (itemClick)="sidebarService.workspace.toggle()"
    matTooltipPosition="right"
    data-testid="workspaceBtn"
  >
    <mat-icon>topic</mat-icon>
  </ame-bar-item>

  <ame-bar-item
    class="sidebar__item sidebar__elements"
    [matTooltipShowDelay]="0"
    [matTooltipHideDelay]="0"
    [class.selected]="sidebarService.sammElements.opened()"
    [matTooltip]="t('tooltips.elements')"
    (itemClick)="sidebarService.sammElements.toggle()"
    matTooltipPosition="right"
    data-testid="elementsBtn"
  >
    <mat-icon>view_comfy_alt</mat-icon>
  </ame-bar-item>

  <ame-bar-item
    class="sidebar__item sidebar__theme"
    [matTooltipShowDelay]="0"
    [matTooltipHideDelay]="0"
    [matTooltip]="isDarkMode ? t('tooltips.lightMode') : t('tooltips.darkMode')"
    (itemClick)="toggleDarkMode()"
    matTooltipPosition="right"
    data-testid="darkModeBtn"
  >
    <mat-icon>{{ isDarkMode ? 'light_mode' : 'dark_mode' }}</mat-icon>
  </ame-bar-item>

  <ame-bar-item
    class="sidebar__item sidebar__settings"
    [matTooltipShowDelay]="0"
    [matTooltipHideDelay]="0"
    [matTooltip]="t('tooltips.settings')"
    (itemClick)="openSettingsDialog()"
    matTooltipPosition="right"
    data-testid="settingsBtn"
  >
    <mat-icon>settings</mat-icon>
  </ame-bar-item>

  <ame-bar-item
    class="sidebar__item sidebar__notifications"
    [matTooltipShowDelay]="0"
    [matTooltipHideDelay]="0"
    [matTooltip]="t('tooltips.notifications')"
    (itemClick)="openNotificationDialog()"
    matTooltipPosition="right"
    data-testid="notificationsBtn"
  >
    <mat-icon [matBadge]="notificationService.badgeText | async" aria-hidden="false">notifications</mat-icon>
  </ame-bar-item>

  <ame-bar-item
    class="sidebar__item sidebar__help"
    [matTooltipShowDelay]="0"
    [matTooltipHideDelay]="0"
    [matTooltip]="t('tooltips.help')"
    (itemClick)="openHelpDialog()"
    matTooltipPosition="right"
    data-testid="helpBtn"
  >
    <mat-icon>help</mat-icon>
  </ame-bar-item>
</ng-container>
