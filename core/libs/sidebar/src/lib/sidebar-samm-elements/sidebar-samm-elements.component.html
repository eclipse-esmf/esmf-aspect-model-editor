<ng-container *transloco="let t">
  <ame-resize-gutter
    [(width)]="width"
    [minWidth]="minWidth"
    [maxWidth]="maxWidth"
    [storageKey]="storageKey"
    edge="end"
    data-testid="samm-elements-resize-gutter"
  ></ame-resize-gutter>

  <div class="header">
    <a
      class="title"
      [href]="sammDocumentationUrl"
      [matTooltip]="t('sidebar.sammElementsDocumentation', {version: sammVersion})"
      [attr.aria-label]="t('sidebar.sammElementsDocumentation', {version: sammVersion})"
      ameExternalLink
      target="_blank"
      rel="noopener noreferrer"
      data-testid="samm-elements-docs-link"
    >
      <h2>{{ t('sidebar.sammElements') }}</h2>
      <mat-icon class="info-icon">info_outline</mat-icon>
    </a>
    @if (!isEmptyModel) {
      <button (click)="sidebarService.sammElements.close()" mat-mini-fab data-testid="sidebar-close">
        <mat-icon>close</mat-icon>
      </button>
    }
  </div>

  <div class="content">
    @for (element of availableElements(); track element) {
      <ame-draggable-element [type]="element">
        <ame-element [type]="sammElements[element]" [name]="sammElements[element].name"></ame-element>
      </ame-draggable-element>
    }
  </div>
</ng-container>
