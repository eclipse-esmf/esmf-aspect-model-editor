  @if (loading()) {
    <div class="loading">
      <mat-spinner></mat-spinner>
      <p>{{ t('sidebar.empty.loadingNamespaces') }}</p>
    </div>
  } @else {
    <p>{{ t('sidebar.empty.saveMessage') }}</p>
    <p>{{ t('sidebar.empty.callToAction') }}</p>
    <button (click)="fileInput.click()" mat-flat-button color="primary">
      {{ t('sidebar.empty.importButton') }}
    </button>
    <input #fileInput (change)="onFileInput(fileInput.files)" hidden type="file" />
  }
</ng-container>
