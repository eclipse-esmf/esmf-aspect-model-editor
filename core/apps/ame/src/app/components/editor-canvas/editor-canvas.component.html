@if (isToolbarVisible()) {
  <ame-editor-toolbar class="toolbar"></ame-editor-toolbar>
}

<ame-sidebar class="sidebar"></ame-sidebar>

@if (isShapeSettingsOpened(); as isOpened) {
  <section class="info-section" [style.width.px]="sidebarWidth()" cdkDragLockAxis="x" cdkDrag>
    <div
      class="info-section__gutter"
      [cdkDragFreeDragPosition]="sidebarDragPosition()"
      (cdkDragEnded)="onDragEnded($event)"
      data-cy="info-section-drag"
      cdkDrag
      cdkDragHandle
      cdkDragLockAxis="x"
    >
      <div class="info-section__indication-line"></div>
      <mat-icon class="info-section__icon">more_vert</mat-icon>
    </div>
    <ame-shape-settings
      [modelElement]="modelElement"
      [isOpened]="isOpened"
      (save)="onShapeSettingsSave($event)"
      (afterClose)="resetSelectedShapeForUpdate()"
    >
    </ame-shape-settings>
  </section>
} @else if (isElementsSearchOpened()) {
  <ame-elements-search></ame-elements-search>
} @else if (isFilesSearchOpened()) {
  <ame-files-search></ame-files-search>
}

<div id="graph" #graph></div>

@if (isModelEmpty()) {
  <div class="empty-model" *transloco="let t">
    <span>
      {{ t('editorCanvas.dragElementLine1') }} <br />
      {{ t('editorCanvas.dragElementLine2') }}
    </span>
  </div>
}

<div class="map-graph" id="outline" [class.hidden]="isMapVisible() === false">
  <div
    class="map"
    (click)="toggleMap()"
    (keyup.enter)="toggleMap()"
    (keyup.space)="toggleMap()"
    tabindex="0"
    role="button"
    aria-label="Toggle map visibility"
  >
    <mat-icon>map</mat-icon>
  </div>
</div>
