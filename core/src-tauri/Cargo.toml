[package]
name = "app"
version = "0.1.0"
description = "Graphical editor for SAMM Aspect Models"
authors = ["ESMF <esmf-dev@eclipse.org>"]
license = "MPL-2.0"
repository = "https://github.com/eclipse-esmf/esmf-aspect-model-editor"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
open = "5"
tokio = { version = "1", features = ["full"] }
dirs = "5"

[dev-dependencies]
tauri = { version = "2.11.3", features = ["test", "tray-icon"] }
# Same version as used by tauri; only used to validate the menu accelerators in tests.
muda = { version = "0.19", default-features = false }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

