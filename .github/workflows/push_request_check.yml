name: Check New Pull Request

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ '**' ]
    paths-ignore:
      - 'documentation/decisions/**'

permissions: {}

# Tests are done in Ubuntu because Mac and Windows random failures, and it is not stable.
jobs:
  build:
    name: Check if passes all requirements
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 #v6.0.1
        with:
          fetch-depth: 0

      - name: Cache node modules
        uses: actions/cache@9255dc7a253b0ccc959486e2bca901246202afeb #v5.0.1@v3
        env:
          cache-name: cache-node-modules
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - name: Install chrome browser
        uses: browser-actions/setup-chrome@b94431e051d1c52dcbe9a7092a4f10f827795416 # v2.1.0
        with:
          chrome-version: stable

      - name: Setup NodeJs
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # 6.1.0
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: latest
          run_install: false

      - name: Clear pnpm cache
        run: pnpm store prune

      - name: Install node modules (Dev)
        run: |
          pnpm install
          pnpm rebuild nx
          pnpm dlx cypress install
        working-directory: core

      - name: Identifying and reporting lint patterns
        run: pnpm run lint
        working-directory: core

      - name: Performing jest tests
        run: pnpm run test
        working-directory: core

      - name: Performing cypress tests
        run: pnpm run cypress:ci
        working-directory: core

      - name: Build dev package
        run: pnpm run build
        working-directory: core
