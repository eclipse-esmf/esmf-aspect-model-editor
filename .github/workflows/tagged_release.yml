name: "Create Tagged Release"

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Version number of the release, e.g. 2.3.0 or 2.3.0-rc1 (pre-release)'
        required: true

permissions: {}

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Validate version
        id: version
        env:
          RELEASE_VERSION: ${{ github.event.inputs.release_version }}
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Invalid release version. Expected e.g. 2.3.0 or 2.3.0-rc1."
            exit 1
          fi
          prerelease=false
          if [[ "$RELEASE_VERSION" == *-rc* ]]; then prerelease=true; fi
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - name: Checkout project
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 #v6.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set documentation version, create release branch and tag
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git checkout -b "${RELEASE_VERSION%.*}.x"
          yq eval -i '.version = strenv(RELEASE_VERSION)' documentation/ame-guide/antora.yml
          git add documentation/ame-guide/antora.yml
          git commit -m "Set version to $RELEASE_VERSION"
          git push origin "${RELEASE_VERSION%.*}.x"
          git tag "v$RELEASE_VERSION"
          git push origin "v$RELEASE_VERSION"

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          gh release create "v$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "v$RELEASE_VERSION" --notes "" --prerelease="$PRERELEASE"

  build:
    name: Build (${{ matrix.platform }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-15-intel
            platform: mac-x64
          - os: macos-latest
            platform: mac-arm64
          - os: windows-latest
            platform: win
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      PLATFORM: ${{ matrix.platform }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # backend release of the same owner, so that a fork uses the backend release of the fork
      BACKEND_REPOSITORY: ${{ github.repository_owner }}/esmf-aspect-model-editor-backend
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout project
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 #v6.0.1
        with:
          ref: v${{ needs.prepare.outputs.version }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11
          run_install: false

      - name: Setup NodeJs
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # 6.1.0
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: core/pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: core/src-tauri -> target
          key: ${{ matrix.platform }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # The backend is released as jpackage app image per platform. It is unpacked into backend/<os>/,
      # which `pnpm run build:tauri` (utils/tauri-build.mjs) adds as bundle resource via
      # src-tauri/tauri.bundle-backend.<os>.conf.json; the app locates the launcher at runtime.
      - name: Download backend (Linux, macOS)
        if: runner.os != 'Windows'
        run: |
          download() {
            gh release download "v$RELEASE_VERSION" --repo "$BACKEND_REPOSITORY" \
              --pattern "$1" --dir backend-download
          }
          mkdir -p backend-download
          case "$PLATFORM" in
            linux)
              download "*-linux.tar.gz"
              mkdir -p backend/linux
              tar -xzf backend-download/*-linux.tar.gz -C backend/linux
              ls -la backend/linux/*/bin ;;
            mac-*)
              download "*-$PLATFORM.tar.gz"
              mkdir -p backend/macos
              tar -xzf backend-download/*-"$PLATFORM".tar.gz -C backend/macos
              ls -la backend/macos/*.app/Contents/MacOS ;;
          esac
          rm -rf backend-download

      - name: Download backend (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path backend/windows, backend-download | Out-Null
          gh release download "v$env:RELEASE_VERSION" --repo "$env:BACKEND_REPOSITORY" `
            --pattern '*-win.zip' --dir backend-download
          if ($LASTEXITCODE -ne 0) { Write-Error "No Windows backend archive found."; exit 1 }
          Get-ChildItem backend-download -Filter '*-win.zip' | ForEach-Object {
            Expand-Archive -Path $_.FullName -DestinationPath backend/windows
          }
          Remove-Item -Recurse -Force backend-download
          Get-ChildItem -Recurse -Depth 1 -Filter 'ame-backend*.exe' backend/windows

      - name: Install node modules
        working-directory: core
        run: |
          pnpm install
          pnpm rebuild nx

      - name: Set app version
        working-directory: core
        run: |
          pnpm version "$RELEASE_VERSION" --no-git-checks --no-git-tag-version
          node -e "const fs=require('fs'); const p='src-tauri/tauri.conf.json'; const c=JSON.parse(fs.readFileSync(p,'utf8')); c.version=process.env.RELEASE_VERSION; fs.writeFileSync(p, JSON.stringify(c, null, 2));"

      - name: Build desktop app
        working-directory: core
        run: pnpm run build:tauri

      # Tauri creates the installers itself (see bundle > targets in src-tauri/tauri.<os>.conf.json):
      # Linux: .AppImage and .deb, macOS: .app and .dmg, Windows: NSIS setup .exe
      - name: Collect release artifacts
        run: |
          bundle=core/src-tauri/target/release/bundle
          name="aspect-model-editor-v$RELEASE_VERSION"
          mkdir -p release-artifacts
          case "$PLATFORM" in
            linux)
              glibc=$(ldd --version | head -n 1 | awk '{print $NF}')
              cp "$bundle"/appimage/*.AppImage "release-artifacts/$name-linux-glibc-v$glibc.AppImage"
              cp "$bundle"/deb/*.deb "release-artifacts/$name-linux-amd64.deb" ;;
            mac-*)
              cp "$bundle"/dmg/*.dmg "release-artifacts/$name-$PLATFORM.dmg"
              # the .app is a folder; ditto keeps symlinks, permissions and extended attributes
              app=("$bundle"/macos/*.app)
              ditto -c -k --sequesterRsrc --keepParent "${app[0]}" "release-artifacts/$name-$PLATFORM.app.zip" ;;
            win)
              setup=("$bundle"/nsis/*-setup.exe)
              cp "${setup[0]}" "release-artifacts/$name-win.exe" ;;
          esac
          ls -la release-artifacts

      # Only Windows: the Jenkins job downloads this artifact to sign the installer.
      # Linux and macOS are uploaded to the release directly.
      - name: Upload Windows installer as workflow artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
        with:
          name: aspect-model-editor-v${{ needs.prepare.outputs.version }}-${{ matrix.platform }}
          path: release-artifacts/*
          if-no-files-found: error

      # In the original repository the Windows installer is signed and uploaded by the Jenkins job,
      # a fork uploads the unsigned installer
      - name: Upload to draft release
        if: runner.os != 'Windows' || github.repository_owner != 'eclipse-esmf'
        run: gh release upload "v$RELEASE_VERSION" release-artifacts/* --repo "$GITHUB_REPOSITORY" --clobber

  publish:
    name: Publish release
    needs: [ prepare, build ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Publish release
        run: gh release edit "v$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --draft=false

      # Only in the original repository, so that test runs in a fork do not trigger the Eclipse Jenkins.
      # The Jenkins job reads parameters.txt from the branch pre_release_configuration, signs the Windows
      # installer and uploads it to the release.
      - name: Provide Windows artifact for the Jenkins job
        if: github.repository_owner == 'eclipse-esmf'
        run: |
          artifact_id_win=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.name | endswith("-win")) | .id')
          if [ -z "$artifact_id_win" ]; then
            echo "::error::Windows artifact not found."
            exit 1
          fi

          parameters="artifact_url_win=https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id_win/zip
          version=$RELEASE_VERSION"
          branch=pre_release_configuration

          # The branch and parameters.txt are created via the GitHub API, which needs no checkout and git push.
          # The branch of a previous release is replaced.
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" --silent 2> /dev/null; then
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch"
          fi
          release_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/v$RELEASE_VERSION" --jq '.sha')
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/heads/$branch" -f sha="$release_sha" --silent
          gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/parameters.txt" --silent \
            -f branch="$branch" \
            -f message="Add parameters.txt with artifact_url_win and the version" \
            -f content="$(printf '%s\n' "$parameters" | base64 -w 0)"

      - name: Trigger Jenkins job for signing the Windows installer
        if: github.repository_owner == 'eclipse-esmf'
        run: |
          DATA='{"repository": {"url": "https://github.com/eclipse-esmf/esmf-aspect-model-editor", "html_url": "https://github.com/eclipse-esmf/esmf-aspect-model-editor", "owner": { "name": "ESMF"}}, "pusher": { "name": "GitHub Action", "email": "esmf-dev@eclipse.org"}}'
          SHA1="$(echo -n "${DATA}" | openssl dgst -sha1 -hmac "${WEBHOOK_SECRET}" | sed 's/SHA1(stdin)= //')"
          curl -X POST https://ci.eclipse.org/esmf/github-webhook/ -H "Content-Type: application/json" -H "X-GitHub-Event: push" -H "X-Hub-Signature: sha1=${SHA1}" -d "${DATA}"
