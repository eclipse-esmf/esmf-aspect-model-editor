name: "Create Tagged Release"

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Version number of the release'
        required: true

env:
  RELEASE_VERSION: ${{ github.event.inputs.release_version }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

permissions: {}

jobs:
  build:
    name: Create tagged release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ macos-15-intel, windows-latest, ubuntu-latest ]
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout project
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 #v6.0.1
        with:
          fetch-depth: 0

      - name: Setup Git
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

      - name: Cache node modules
        uses: actions/cache@9255dc7a253b0ccc959486e2bca901246202afeb #v5.0.1
        env:
          cache-name: cache-node-modules
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - name: Setup NodeJs
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # 6.1.0
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: latest
          run_install: false

      - name: Set versions
        if: matrix.os == 'ubuntu-latest'
        run: |
          release_branch_name=${RELEASE_VERSION%.*}.x
          echo "release_branch_name=$release_branch_name" >> $GITHUB_ENV

      - name: Get glibc version
        if: matrix.os == 'ubuntu-latest'
        run: |
          version=$(ldd --version | head -n 1 | awk '{print $NF}')
          echo "GLIBC_VERSION=$version" >> $GITHUB_ENV
          echo "::set-output name=glibc_version::$version"

      - name: Set antora version
        if: matrix.os == 'ubuntu-latest'
        run: yq eval -i '.version = "${{ env.RELEASE_VERSION }}"' documentation/ame-guide/antora.yml

      - name: Commit version changes and push to upstream repository
        if: matrix.os == 'ubuntu-latest'
        run: |
          git config --global user.email "github-actions@github.com"
          git config --global user.name "github-actions"
          git checkout -b ${{ env.release_branch_name }}
          git add documentation/ame-guide/antora.yml
          git commit -m "Set version to ${RELEASE_VERSION}"
          git push origin ${{ env.release_branch_name }}
          git tag v${RELEASE_VERSION}
          git push origin v${RELEASE_VERSION}

      # The backend is released as jpackage app-image per OS. It is unpacked into backend/<os>/,
      # which `pnpm run build:desktop` (utils/tauri-build.mjs) adds as bundle resource via
      # src-tauri/tauri.bundle-backend.<os>.conf.json; the app locates the launcher at runtime.
      - name: Download aspect model service into project (Mac)
        if: matrix.os == 'macos-15-intel'
        run: |
          mkdir -p backend/macos backend-download
          gh release download "v${RELEASE_VERSION}" --repo eclipse-esmf/esmf-aspect-model-editor-backend \
            --pattern '*-mac.zip' --dir backend-download
          # ditto keeps symlinks, permissions and extended attributes of the .app bundle
          ditto -x -k backend-download/*-mac.zip backend-download/extracted
          if [ -d backend-download/extracted/Contents ]; then
            # archive created without --keepParent: wrap the bundle content into a .app folder again
            mv backend-download/extracted "backend/macos/ame-backend-${RELEASE_VERSION}-mac.app"
          else
            mv backend-download/extracted/*.app backend/macos/
          fi
          rm -rf backend-download
          ls -la backend/macos/*.app/Contents/MacOS

      - name: Download aspect model service into project (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir -p backend/linux backend-download
          gh release download "v${RELEASE_VERSION}" --repo eclipse-esmf/esmf-aspect-model-editor-backend \
            --pattern '*-linux.tar.gz' --dir backend-download
          tar -xzf backend-download/*-linux.tar.gz -C backend/linux
          rm -rf backend-download
          ls -la backend/linux/*/bin

      - name: Download aspect model service into project (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          New-Item -ItemType Directory -Force -Path backend/windows, backend-download | Out-Null
          gh release download "v$env:RELEASE_VERSION" --repo eclipse-esmf/esmf-aspect-model-editor-backend `
            --pattern '*-win.zip' --dir backend-download
          if ($LASTEXITCODE -ne 0) { Write-Error "No Windows backend archive found."; exit 1 }
          Get-ChildItem backend-download -Filter '*-win.zip' | ForEach-Object {
            Expand-Archive -Path $_.FullName -DestinationPath backend/windows
          }
          Remove-Item -Recurse -Force backend-download
          Get-ChildItem -Recurse -Depth 1 -Filter 'ame-backend*.exe' backend/windows
        shell: pwsh

      - name: Clear pnpm cache
        run: pnpm store prune

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: stable

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install node modules
        run: |
          pnpm install
          pnpm rebuild nx
        working-directory: core

      - name: Set app version (Unix)
        if: matrix.os == 'macos-15-intel' || matrix.os == 'ubuntu-latest'
        run: |
          pnpm version ${{ env.RELEASE_VERSION }} --no-git-checks --no-git-tag-version
          node -e "const p='src-tauri/tauri.conf.json'; const c=require('./'+p); c.version='${{ env.RELEASE_VERSION }}'; require('fs').writeFileSync(p, JSON.stringify(c, null, 2));"
        working-directory: core

      - name: Set app version (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          pnpm version ${{ env.RELEASE_VERSION }} --no-git-checks --no-git-tag-version
          node -e "const p='src-tauri/tauri.conf.json'; const c=require('./'+p); c.version='${{ env.RELEASE_VERSION }}'; require('fs').writeFileSync(p, JSON.stringify(c, null, 2));"
        working-directory: core

      - name: Build desktop app
        run: pnpm run build:desktop
        working-directory: core

      # Tauri creates the native installers itself (see bundle > targets in tauri.<os>.conf.json):
      # macOS: .dmg containing the .app bundle, Linux: .AppImage and .deb, Windows: NSIS setup .exe
      - name: Collect release artifacts (Mac)
        if: matrix.os == 'macos-15-intel'
        run: |
          mkdir -p release-artifacts
          cp core/src-tauri/target/release/bundle/dmg/*.dmg \
            "release-artifacts/aspect-model-editor-v${RELEASE_VERSION}-mac.dmg"

      - name: Collect release artifacts (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir -p release-artifacts
          cp core/src-tauri/target/release/bundle/appimage/*.AppImage \
            "release-artifacts/aspect-model-editor-v${RELEASE_VERSION}-linux-glibc-v${GLIBC_VERSION}.AppImage"
          cp core/src-tauri/target/release/bundle/deb/*.deb \
            "release-artifacts/aspect-model-editor-v${RELEASE_VERSION}-linux-amd64.deb"

      - name: Collect release artifacts (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          New-Item -ItemType Directory -Force -Path release-artifacts | Out-Null
          Copy-Item (Get-ChildItem core/src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1).FullName `
            "release-artifacts/aspect-model-editor-v$env:RELEASE_VERSION-win.exe"
        shell: pwsh

      # The Windows installer is signed by the Jenkins job (see release job) and uploaded to the release from there
      - name: Upload binary (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f #v6.0.0
        with:
          name: aspect-model-editor-v${{ env.RELEASE_VERSION }}-win
          path: release-artifacts/aspect-model-editor-v${{ env.RELEASE_VERSION }}-win.exe

      - name: Upload binary (Mac)
        if: matrix.os == 'macos-15-intel'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f #v6.0.0
        with:
          name: aspect-model-editor-v${{ env.RELEASE_VERSION }}-mac
          path: release-artifacts/aspect-model-editor-v${{ env.RELEASE_VERSION }}-mac.dmg

      - name: Upload binary (Linux)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f #v6.0.0
        with:
          name: aspect-model-editor-v${{ env.RELEASE_VERSION }}-linux
          path: release-artifacts/aspect-model-editor-v${{ env.RELEASE_VERSION }}-linux*

      # Release Linux executables
      - name: Create GitHub release (Linux)
        if: ${{ (matrix.os == 'ubuntu-latest') && (!contains( github.ref, '-rc' )) }}
        uses: svenstaro/upload-release-action@6b7fa9f267e90b50a19fef07b3596790bb941741 # v2.11.3
        with:
          overwrite: true
          prerelease: false
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: release-artifacts/aspect-model-editor-v${{ env.RELEASE_VERSION }}-linux*
          file_glob: true
          tag: v${{ env.RELEASE_VERSION }}

      - name: Create GitHub pre-release (Linux)
        if: ${{ (matrix.os == 'ubuntu-latest') && (contains( github.ref, '-rc' )) }}
        uses: svenstaro/upload-release-action@6b7fa9f267e90b50a19fef07b3596790bb941741 # v2.11.3
        with:
          overwrite: true
          prerelease: true
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: release-artifacts/aspect-model-editor-v${{ env.RELEASE_VERSION }}-linux*
          file_glob: true
          tag: v${{ env.RELEASE_VERSION }}

      # Release Mac executables
      - name: Create GitHub release (Mac)
        if: ${{ (matrix.os == 'macos-15-intel') && (!contains( github.ref, '-rc' )) }}
        uses: svenstaro/upload-release-action@6b7fa9f267e90b50a19fef07b3596790bb941741 # v2.11.3
        with:
          overwrite: true
          prerelease: false
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: release-artifacts/aspect-model-editor-v${{ env.RELEASE_VERSION }}-mac.dmg
          tag: v${{ env.RELEASE_VERSION }}

      - name: Create GitHub pre-release (Mac)
        if: ${{ (matrix.os == 'macos-15-intel') && (contains( github.ref, '-rc' )) }}
        uses: svenstaro/upload-release-action@6b7fa9f267e90b50a19fef07b3596790bb941741 # v2.11.3
        with:
          overwrite: true
          prerelease: true
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: release-artifacts/aspect-model-editor-v${{ env.RELEASE_VERSION }}-mac.dmg
          tag: v${{ env.RELEASE_VERSION }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout project
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 #v6.0.1
        with:
          fetch-depth: 0

      # Sign Windows executable
      - name: Get Artifact ID Windows
        shell: bash
        run: |
          # Get the list of artifacts for the specified workflow run
          response=$(curl -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository_owner }}/$(echo '${{ github.repository }}' | cut -d'/' -f2)/actions/runs/${{ github.run_id }}/artifacts")

          # Filter out the ID of the artifacts
          artifact_id_win=$(echo "$response" | jq -r '.artifacts[] | select(.name | contains("win")) | .id')

          # Save the artifact ID in an environment variable
          echo "ARTIFACT_ID_WIN=$artifact_id_win" >> $GITHUB_ENV
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit Artifact url and version changes and push to pre release branch for jenkins Windows
        shell: bash
        run: |
          ARTIFACT_URL_WIN="https://api.github.com/repos/eclipse-esmf/esmf-aspect-model-editor/actions/artifacts/$ARTIFACT_ID_WIN/zip"
          BRANCH_NAME="pre_release_configuration"

          echo "artifact_url_win=$ARTIFACT_URL_WIN" > parameters.txt
          echo "version=${RELEASE_VERSION}" >> parameters.txt

          git config --global user.email "github-actions@github.com"
          git config --global user.name "github-actions"
          git checkout -b $BRANCH_NAME
          git add parameters.txt
          git commit -m "Add parameters.txt with artifact_url_win and the version"
          git push origin $BRANCH_NAME
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger Jenkins Job, for signing executable
        shell: bash
        run: |
          DATA='{"repository": {"url": "https://github.com/eclipse-esmf/esmf-aspect-model-editor", "html_url": "https://github.com/eclipse-esmf/esmf-aspect-model-editor", "owner": { "name": "ESMF"}}, "pusher": { "name": "GitHub Action", "email": "esmf-dev@eclipse.org"}}'
          SHA1="$(echo -n "${DATA}" | openssl dgst -sha1 -hmac "${WEBHOOK_SECRET}" | sed 's/SHA1(stdin)= //')"
          curl -X POST https://ci.eclipse.org/esmf/github-webhook/ -H "Content-Type: application/json" -H "X-GitHub-Event: push" -H "X-Hub-Signature: sha1=${SHA1}" -d "${DATA}"
